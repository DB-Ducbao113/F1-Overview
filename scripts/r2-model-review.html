<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDS-G02 original chassis review — local only</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151c26;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 16px;
        color: #e7f3f4;
        font:
          12px system-ui,
          sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status" aria-live="polite">Loading original EDS chassis study...</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';

      const params = new URLSearchParams(location.search);
      const modelName = params.get('model') === 'g01' ? 'eds-g01' : 'eds-g02';
      const views = {
        front: [
          [0, 1.0, -5.2],
          [0, 0.35, -0.35],
        ],
        side: [
          [5.3, 1.15, 0],
          [0, 0.38, 0],
        ],
        top: [
          [0.01, 6.6, 0],
          [0, 0.2, 0],
        ],
        rear: [
          [0, 0.54, 5.0],
          [0, 0.24, 0.85],
        ],
        threeQuarter: [
          [4.1, 1.75, -4.1],
          [0, 0.43, 0],
        ],
        showroom: [
          [2.8, 1.4, -2.8],
          [0, 0.42, 0],
        ],
      };
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#151c26');
      const environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(),
      ).texture;
      scene.environment = environment;
      const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
      function setView(name) {
        const [position, target] = views[name] ?? views.showroom;
        const aspect = innerWidth / innerHeight;
        const scale = aspect < 0.58 ? 2.6 : aspect < 0.9 ? 2.55 : 1;
        const targetVector = new THREE.Vector3(...target);
        camera.position.copy(
          targetVector
            .clone()
            .add(new THREE.Vector3(...position).sub(targetVector).multiplyScalar(scale)),
        );
        camera.lookAt(targetVector);
        camera.updateProjectionMatrix();
      }
      setView(params.get('view') || 'showroom');

      scene.add(new THREE.AmbientLight('#ffffff', 1.0));
      const key = new THREE.DirectionalLight('#ffffff', 2.4);
      key.position.set(6, 8, -4.5);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      scene.add(key);
      const fill = new THREE.DirectionalLight('#85dce7', 1.4);
      fill.position.set(-5, 4, 3.5);
      scene.add(fill);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: '#303944', roughness: 0.48, metalness: 0.38 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.005;
      floor.receiveShadow = true;
      scene.add(floor);

      const gltf = await new GLTFLoader().loadAsync(`/models/${modelName}.glb`);
      const model = gltf.scene;
      model.traverse((node) => {
        if (!(node instanceof THREE.Mesh)) return;
        node.castShadow = true;
        node.receiveShadow = true;
        // Same EDS AERO VELOCITY livery on both models for geometry comparison.
        const name = node.name.toLowerCase();
        const base = name.includes('tire')
          ? '#0b0c0e'
          : name.includes('rim')
            ? '#8495a5'
            : name.includes('accent') ||
                name.includes('wing') ||
                name.includes('halo') ||
                name.includes('cooling')
              ? '#46dce8'
              : name.includes('carbon') || name.includes('floor') || name.includes('diffuser')
                ? '#0b1015'
                : name.includes('cockpit') || name.includes('intake') || name.includes('seam')
                  ? '#080c10'
                  : name.includes('metal') || name.includes('mechanical') || name.includes('brake')
                    ? '#48535d'
                    : '#0d1c33';
        node.material = new THREE.MeshPhysicalMaterial({
          color: base,
          roughness: name.includes('tire') ? 0.85 : name.includes('carbon') ? 0.66 : 0.25,
          metalness: name.includes('tire')
            ? 0.02
            : name.includes('rim') || name.includes('metal')
              ? 0.72
              : name.includes('carbon') || name.includes('floor') || name.includes('diffuser')
                ? 0.05
                : 0.18,
          clearcoat: name.includes('body') ? 0.82 : 0.3,
          clearcoatRoughness: 0.16,
          envMapIntensity: name.includes('carbon') ? 0.8 : 1.3,
        });
      });
      scene.add(model);
      document.querySelector('#status').textContent =
        `${modelName.toUpperCase()} · original review camera`;
      const gl = renderer.getContext();
      const debug = gl.getExtension('WEBGL_debug_renderer_info');
      const gpu = debug
        ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
        : 'GPU renderer unavailable';
      const times = [];
      let lastTime = null;
      function frame(now) {
        if (lastTime !== null && times.length < 240) times.push(now - lastTime);
        lastTime = now;
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.__r2Review = {
        ready: true,
        setView,
        getStats() {
          const frameTimes = times.slice(30).sort((a, b) => a - b);
          return {
            gpu,
            model: modelName,
            calls: renderer.info.render.calls,
            triangles: renderer.info.render.triangles,
            geometries: renderer.info.memory.geometries,
            textures: renderer.info.memory.textures,
            viewport: [innerWidth, innerHeight],
            frameSamples: frameTimes.length,
            medianRafMs: frameTimes[Math.floor(frameTimes.length / 2)] ?? null,
            p95RafMs: frameTimes[Math.floor(frameTimes.length * 0.95)] ?? null,
          };
        },
      };
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        renderer.setSize(innerWidth, innerHeight);
        setView(params.get('view') || 'showroom');
      });
    </script>
  </body>
</html>
