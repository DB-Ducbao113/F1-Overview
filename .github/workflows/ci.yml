name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'perf/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Unit Tests & Coverage
        run: npm run test:coverage

      - name: Build and enforce initial bundle budget
        run: npm run build:check

      - name: Security Audit (Dependencies)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Secret scan (no real tokens in tree)
        run: |
          # Quét pattern token GitHub, loại trừ fixture cố ý chứa chuỗi giả.
          if grep -rEn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=coverage --exclude-dir=.git --exclude='secret-scan.fixture' 'ghp_[A-Za-z0-9]{20,}' .; then
            echo 'Possible real token pattern found in tree (fixture excluded).'
            exit 1
          fi
          # Tự kiểm tra quy tắc: fixture phải khớp pattern (chứng minh scanner hoạt động).
          grep -qE 'ghp_[A-Za-z0-9]{20,}' scripts/fixtures/secret-scan.fixture
