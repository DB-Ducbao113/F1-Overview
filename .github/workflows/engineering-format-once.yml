name: Temporary Engineering V2 Formatter

on:
  push:
    branches:
      - feat/engineering-inside-machine-v2
    paths:
      - 'src/features/engineering/**'
      - 'src/App.tsx'
      - 'src/components/layout/Navbar.tsx'
      - '.github/workflows/engineering-format-once.yml'

permissions:
  contents: write

jobs:
  format-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/engineering/ui/InsideMachineView.tsx src/features/engineering/ui/insideMachine.css src/features/engineering/rendering/InsideMachineScene.tsx src/features/engineering/DELIVERY.md src/App.tsx src/components/layout/Navbar.tsx
      - name: Commit formatting to feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/engineering src/App.tsx src/components/layout/Navbar.tsx
            git commit -m "style(engineering): format V2 implementation"
            git push origin HEAD:feat/engineering-inside-machine-v2
          fi
