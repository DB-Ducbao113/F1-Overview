name: Auto Update F1 2026 Data

on:
  schedule:
    # Check completed race-weekend sessions every 15 minutes (UTC Thu-Sun).
    # Builds are skipped unless the API snapshot or championship data changed.
    - cron: '*/15 * * * 4,5,6,0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      force:
        description: 'Force update even on Monday or Tuesday'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-f1-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_UPDATE_F1_RESULT_TOKEN || github.token }}

      - name: Check project readiness
        id: check_ready
        run: |
          if [ ! -f "package.json" ] || [ ! -f "scripts/update-2026-data.js" ] || [ ! -f "scripts/sync-openf1-sessions.js" ]; then
            echo "Project scaffold not yet merged to this branch. Skipping auto-update."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check_ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync completed sessions from F1 live timing
        if: steps.check_ready.outputs.ready == 'true'
        run: node scripts/sync-openf1-sessions.js

      - name: Sync 2026 Season Data from Jolpica
        if: steps.check_ready.outputs.ready == 'true'
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/update-2026-data.js --force
          else
            node scripts/update-2026-data.js
          fi

      - name: Detect new API data
        if: steps.check_ready.outputs.ready == 'true'
        id: data_changes
        run: |
          if git diff --quiet -- src/data/championship/ src/services/ src/store/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new F1 data. Skipping install, build and deploy."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.data_changes.outputs.changed == 'true'
        run: npm ci

      - name: Verify build with updated data
        if: steps.data_changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push changes
        if: steps.data_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/championship/ src/services/ src/store/
          if git diff --staged --quiet; then
            echo "No new F1 data changes detected."
          else
            echo "New F1 data detected! Committing and pushing..."
            git commit -m "chore(data): auto-update 2026 F1 race & standings"
            # Attempt push, but handle protected branch gracefully if direct push is forbidden
            if ! git push origin HEAD; then
              echo "::warning::Direct push to branch failed. Please verify branch protection rules or configure a personal access token (PAT) with bypass rights."
            fi
          fi
