pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Writable temp paths for non-root worker
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/json
        application/javascript
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers (kept in sync with vercel.json; COOP/COEP stay
    # report-only until evaluated against the 3D showroom assets).
    # NOTE: no Reporting-Endpoints/report-uri is configured (no collector
    # backend exists), so CSP/COOP/COEP reports surface in the browser console
    # only. Check there before ever enforcing COOP/COEP: enforced COEP would
    # block any cross-origin 3D/font asset served without CORP headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy-Report-Only "same-origin" always;
    add_header Cross-Origin-Embedder-Policy-Report-Only "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://server.arcgisonline.com https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https://api.jolpi.ca https://api.openf1.org https://vitals.vercel-insights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Healthcheck endpoint for DevOps monitoring / load balancers
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Vite bundles are content-hashed and safe to cache immutably.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # Versioned 3D models are also immutable.
    location /models/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # Public image filenames are stable, so allow periodic revalidation.
    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2?|eot|ttf|otf)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
      access_log off;
    }

    # SPA routing fallback: send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
